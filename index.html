<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Free Together</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=DM+Mono:wght@400;500&family=Figtree:wght@400;500;600&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="2" y="2" width="12" height="12" rx="3" fill="var(--m1)"/><rect x="18" y="2" width="12" height="12" rx="3" fill="var(--surface2)"/><rect x="2" y="18" width="12" height="12" rx="3" fill="var(--surface2)"/><rect x="18" y="18" width="12" height="12" rx="3" fill="var(--free)"/></svg>
      <h1>Free Together</h1>
    </div>
    <nav class="tabs" id="tabs" aria-label="Friend groups"></nav>
  </header>
  <div id="banner"></div>
  <div class="layout">
    <aside class="rail" id="rail"></aside>
    <main class="main" id="main"></main>
  </div>
</div>
<dialog id="dlg" aria-modal="true"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="app.js"></script>
</body>
</html>
